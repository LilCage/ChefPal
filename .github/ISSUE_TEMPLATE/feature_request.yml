name: ✨ 功能建议
description: 提出一个新功能或改进想法
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        先看看 [README](https://github.com/LilCage/ChefPal#readme) 和需求文档，避免重复建议。
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述你遇到的场景 / 痛点，而不是直接甩方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你的想法
      description: 功能形态、交互方式、可选的实现思路
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 如果有的话

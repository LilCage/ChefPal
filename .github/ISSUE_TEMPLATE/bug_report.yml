name: 🐛 Bug 报告
description: 提交一个问题，帮助我们改进
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢报告问题！请尽量提供完整信息，方便快速定位。
  - type: input
    id: version
    attributes:
      label: 版本 / 提交
      description: 后端版本或 commit hash（`git rev-parse --short HEAD`）
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 问题模块
      options:
        - 后端 / API
        - 小程序前端
        - 部署 / 环境
        - 文档
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 尽量给出可复现的最小步骤（含请求参数 / 页面操作）
      placeholder: |
        1. 启动后端...
        2. 调用 xxx 接口...
        3. 观察到...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 错误信息 / 堆栈 / 截图请附在这里（敏感信息请脱敏）
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: 环境信息
      description: Python 版本、Node 版本、数据库版本、微信开发者工具版本等

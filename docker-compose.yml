# ChefPal 本地开发基础设施
# 用法: docker compose up -d postgres
services:
  postgres:
    # pgvector 官方镜像（PG16 + vector 扩展），供菜谱知识库 RAG 向量检索
    image: pgvector/pgvector:pg16
    container_name: chefpal-postgres
    environment:
      POSTGRES_USER: chefpal
      POSTGRES_PASSWORD: chefpal_dev_password
      POSTGRES_DB: chefpal
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/server/docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chefpal -d chefpal"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:

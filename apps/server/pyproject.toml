[project]
name = "chefpal-server"
version = "0.1.0"
description = "ChefPal FastAPI 后端（AI 烹饪伴侣）"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "LilCage", email = "LilCage@users.noreply.github.com" }]
keywords = ["wechat-miniprogram", "fastapi", "ai", "cooking", "rag", "taro"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "langchain>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "langgraph>=0.2",
    "pgvector>=0.3",
    "httpx>=0.27",
    "PyJWT>=2.8",
    "cos-python-sdk-v5>=1.9.30",
    "trafilatura>=2.0",
    "pypdf>=6.0",
    "python-docx>=1.1",
    "yt-dlp>=2026.0",
]

[project.urls]
Homepage = "https://github.com/LilCage/ChefPal"
Repository = "https://github.com/LilCage/ChefPal"
Documentation = "https://github.com/LilCage/ChefPal#readme"
Issues = "https://github.com/LilCage/ChefPal/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E/F/W: pycodestyle + pyflakes；I: import 排序；UP: pyupgrade；B: bugbear
select = ["E", "F", "W", "I", "UP", "B"]
# E501 行宽暂不强制（历史代码有超长行），后续可收紧
ignore = ["E501"]
